<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
/* =========================================================
   Yueer Peng — Portfolio
   Shared stylesheet for all pages
   ========================================================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cream: #f0ebe2;
  --cream-soft: #f5f1e9;
  --cream-dark: #e8e2d8;
  --ink: #1c1c1a;
  --ink-mid: #4a4a44;
  --ink-muted: #888880;
  --accent: #c05a2a;
  --accent-soft: #e8d5c8;
  --border: #d4cec4;
  --border-soft: #e0dad0;
  --card: #e8e2d8;
}

html { scroll-behavior: smooth; }

body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  overflow-x: hidden;
}

/* =========================================================
   NAVIGATION
   ========================================================= */
nav.site-nav {
  position: sticky; top: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 3rem;
  border-bottom: 1px solid var(--border);
  background: var(--cream);
}
.nav-logo {
  font-weight: 500; font-size: 0.82rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  text-decoration: none; color: var(--ink);
  transition: opacity 0.2s;
}
.nav-logo:hover { opacity: 0.65; }
.site-nav ul { list-style: none; display: flex; gap: 2.2rem; align-items: center; }
.site-nav ul a {
  text-decoration: none; color: var(--ink);
  font-size: 0.78rem; letter-spacing: 0.1em;
  text-transform: uppercase; opacity: 0.5;
  transition: opacity 0.2s;
}
.site-nav ul a:hover { opacity: 1; }
.site-nav ul a.active { opacity: 1; }
.nav-cta {
  font-size: 0.78rem !important; opacity: 1 !important;
  border: 1.5px solid var(--ink);
  border-radius: 99px;
  padding: 0.35rem 0.9rem;
  transition: background 0.2s, color 0.2s;
}
.nav-cta:hover { background: var(--ink); color: var(--cream); }

/* =========================================================
   COMMON: pills, buttons, links
   ========================================================= */
.pill {
  display: inline-block;
  border: 1.5px solid var(--ink);
  border-radius: 99px;
  padding: 0.38rem 0.95rem;
  font-size: 0.75rem; letter-spacing: 0.04em;
  transition: background 0.2s, color 0.2s;
}
.pill:hover { background: var(--ink); color: var(--cream); }

.btn {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.5rem 1.1rem;
  border: 1.5px solid var(--ink); border-radius: 99px;
  font-size: 0.74rem; letter-spacing: 0.06em;
  text-decoration: none; color: var(--ink);
  background: transparent;
  transition: background 0.2s, color 0.2s;
  cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--cream); }
.btn.filled { background: var(--ink); color: var(--cream); }
.btn.filled:hover { background: transparent; color: var(--ink); }

.text-link {
  color: var(--ink); text-decoration: none;
  opacity: 0.55; transition: opacity 0.2s;
  font-size: 0.82rem;
}
.text-link::after { content: ' ↗'; font-size: 0.7rem; }
.text-link:hover { opacity: 1; }

/* =========================================================
   SECTION HEADER (used on home + sub-pages)
   ========================================================= */
.section-header {
  padding: 3.5rem 3rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: baseline;
}
.section-eyebrow {
  font-size: 0.72rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-muted);
  margin-bottom: 0.35rem;
}
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 900; letter-spacing: -0.02em;
}
.section-meta { font-size: 0.8rem; color: var(--ink-muted); }

/* =========================================================
   PROJECT CARDS (home page grid)
   ========================================================= */
.projects-grid { display: grid; grid-template-columns: 1fr 1fr; }
.projects-grid--three { grid-template-columns: 1fr 1fr 1fr; }

.project-card {
  padding: 2.8rem 3rem 2.4rem;
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  background: var(--cream);
  transition: background 0.3s;
  text-decoration: none; color: inherit;
  display: block;
}
.projects-grid > .project-card:nth-child(2n) { border-right: none; }
.projects-grid--three > .project-card:nth-child(3n) { border-right: none; }
.project-card:hover { background: var(--card); }

.card-top {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 1.6rem;
}
.card-tag {
  font-size: 0.66rem; letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 1.5px solid var(--ink); border-radius: 99px;
  padding: 0.26rem 0.75rem;
}
.card-year { font-size: 0.76rem; color: var(--ink-muted); }

.card-mockup {
  width: 100%; aspect-ratio: 16/10;
  border-radius: 6px;
  margin-bottom: 1.5rem;
  overflow: hidden; position: relative;
  transition: transform 0.4s ease;
}
.card-mockup img { width: 100%; height: 100%; object-fit: cover; }
.card-mockup svg { width: 100%; height: 100%; display: block; }
.project-card:hover .card-mockup { transform: scale(1.01); }

.card-title {
  font-weight: 400; font-size: 0.74rem;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-mid); margin-bottom: 0.4rem;
}
.card-desc { font-size: 0.9rem; line-height: 1.6; color: var(--ink-mid); }
.card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.3rem; }

/* =========================================================
   FOOTER
   ========================================================= */
footer.site-footer {
  padding: 2.5rem 3rem;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--border);
}
.footer-copy { font-size: 0.75rem; color: var(--ink-muted); }
.footer-links { display: flex; gap: 1.5rem; }
.footer-links a {
  font-size: 0.75rem; color: var(--ink-muted);
  text-decoration: none; transition: color 0.2s;
}
.footer-links a:hover { color: var(--ink); }

/* =========================================================
   ANIMATIONS
   ========================================================= */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */
@media (max-width: 820px) {
  nav.site-nav { padding: 1rem 1.5rem; }
  .site-nav ul { gap: 1.1rem; }
  .site-nav ul a { font-size: 0.72rem; letter-spacing: 0.08em; }
  .nav-cta { padding: 0.3rem 0.7rem; }
  .projects-grid, .projects-grid--three { grid-template-columns: 1fr; }
  .section-header { padding: 2.5rem 1.5rem 1.5rem; flex-direction: column; gap: 0.3rem; }
  .project-card { padding: 2rem 1.5rem; border-right: none !important; }
  footer.site-footer { flex-direction: column; gap: 1rem; padding: 2rem 1.5rem; text-align: center; }
}

/* =========================================================
   PROJECT CASE STUDY PAGES
   ========================================================= */
.project-page-hero {
  padding: 4rem 3rem 3rem;
  border-bottom: 1px solid var(--border);
}
.breadcrumb {
  font-size: 0.74rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-muted);
  margin-bottom: 1.4rem;
}
.breadcrumb a {
  color: var(--ink-muted); text-decoration: none;
  transition: color 0.2s;
}
.breadcrumb a:hover { color: var(--ink); }
.breadcrumb .sep { margin: 0 0.5rem; opacity: 0.5; }

.project-tagline {
  font-size: 0.78rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 1rem; font-weight: 500;
}
.project-page-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 900; line-height: 1.05;
  letter-spacing: -0.02em; max-width: 18ch;
  margin-bottom: 1.5rem;
  animation: fadeUp 0.8s ease both;
}
.project-page-title em { font-style: italic; color: var(--accent); }
.project-brief {
  font-size: 1.1rem; line-height: 1.7;
  color: var(--ink-mid); max-width: 60ch;
  animation: fadeUp 0.8s ease 0.1s both;
}

.project-meta {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--cream-soft);
}
.meta-item {
  padding: 1.5rem 2rem;
  border-right: 1px solid var(--border);
}
.meta-item:last-child { border-right: none; }
.meta-label {
  font-size: 0.68rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-muted);
  margin-bottom: 0.4rem;
}
.meta-value { font-size: 0.92rem; color: var(--ink); line-height: 1.5; }

.project-hero-image {
  margin: 0; border-bottom: 1px solid var(--border);
  background: var(--cream-dark);
}
.project-hero-image svg { width: 100%; height: auto; display: block; max-height: 600px; }
.project-hero-image img { width: 100%; height: auto; display: block; }

.project-content {
  padding: 5rem 3rem;
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 4rem;
  border-bottom: 1px solid var(--border);
}
.project-content + .project-content {
  border-top: none;
}
.content-label {
  font-size: 0.7rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-muted);
  position: sticky; top: 5rem;
  align-self: start;
}
.content-body {
  max-width: 65ch;
}
.content-body h2 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.6rem, 2.5vw, 2.2rem);
  font-weight: 900; letter-spacing: -0.01em;
  line-height: 1.15; margin-bottom: 1.5rem;
}
.content-body h2 em { font-style: italic; color: var(--accent); }
.content-body h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; font-weight: 700;
  margin: 1.8rem 0 0.6rem;
}
.content-body p {
  font-size: 1rem; line-height: 1.8;
  color: var(--ink-mid); margin-bottom: 1.2rem;
}
.content-body p strong {
  color: var(--ink); font-weight: 500;
}
.content-body ul {
  list-style: none; margin: 1rem 0 1.5rem;
}
.content-body ul li {
  font-size: 0.95rem; line-height: 1.7;
  color: var(--ink-mid); padding-left: 1.5rem;
  position: relative; margin-bottom: 0.6rem;
}
.content-body ul li::before {
  content: '→'; position: absolute; left: 0;
  color: var(--accent); font-weight: 500;
}

.callout-box {
  background: var(--cream-dark);
  border-left: 3px solid var(--accent);
  padding: 1.4rem 1.6rem;
  margin: 1.8rem 0;
  border-radius: 0 6px 6px 0;
}
.callout-box p {
  font-size: 0.95rem; line-height: 1.7;
  color: var(--ink-mid); margin-bottom: 0.4rem;
}
.callout-box p:last-child { margin-bottom: 0; }
.callout-label {
  font-size: 0.7rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 0.5rem; font-weight: 500;
}

/* Visual gallery */
.project-gallery {
  padding: 4rem 3rem;
  border-bottom: 1px solid var(--border);
}
.gallery-eyebrow {
  font-size: 0.7rem; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ink-muted);
  margin-bottom: 0.5rem;
}
.gallery-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.6rem, 2.5vw, 2rem);
  font-weight: 900; letter-spacing: -0.01em;
  margin-bottom: 2.5rem;
}
.gallery-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}
.gallery-item {
  background: var(--cream-soft);
  border: 1px solid var(--border-soft);
  border-radius: 6px;
  overflow: hidden;
  aspect-ratio: 16/10;
  position: relative;
}
.gallery-item svg, .gallery-item img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.gallery-caption {
  font-size: 0.78rem; color: var(--ink-muted);
  padding: 0.8rem 1rem;
  background: var(--cream-soft);
  border-top: 1px solid var(--border-soft);
}

/* Prev / Next nav */
.project-pagination {
  display: grid; grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--border);
}
.pagination-link {
  padding: 2.5rem 3rem;
  text-decoration: none; color: var(--ink);
  border-right: 1px solid var(--border);
  transition: background 0.3s;
  display: block;
}
.pagination-link:last-child { border-right: none; text-align: right; }
.pagination-link:hover { background: var(--cream-dark); }
.pagination-link .pagination-label {
  font-size: 0.7rem; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-muted);
  margin-bottom: 0.4rem;
}
.pagination-link .pagination-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 700;
}

@media (max-width: 820px) {
  .project-page-hero { padding: 2.5rem 1.5rem 2rem; }
  .project-meta { grid-template-columns: 1fr 1fr; }
  .meta-item { padding: 1.2rem 1.5rem; }
  .meta-item:nth-child(2) { border-right: none; }
  .meta-item:nth-child(odd) { border-right: 1px solid var(--border); }
  .meta-item:nth-child(1), .meta-item:nth-child(2) { border-bottom: 1px solid var(--border); }
  .project-content { padding: 3rem 1.5rem; grid-template-columns: 1fr; gap: 1.5rem; }
  .content-label { position: static; }
  .project-gallery { padding: 3rem 1.5rem; }
  .gallery-grid { grid-template-columns: 1fr; }
  .pagination-link { padding: 2rem 1.5rem; }
}

</style>

    }
    .four-oh-four h1 span { font-style: italic; color: var(--accent); }
    .four-oh-four p {
      font-size: 1.1rem; color: var(--ink-mid);
      margin: 1.5rem 0 2.5rem; max-width: 32ch;
    }
  </style>
</head>
